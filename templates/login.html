<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* Global styles */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #e9f0f7;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            transition: box-shadow 0.3s ease;
        }

        .container:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        h2 {
            margin-bottom: 30px;
            color: #007bff;
            font-size: 28px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            color: #555;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="password"]:focus {
            border-color: #007bff;
            outline: none;
        }

        .form-group input[type="submit"],
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .form-group input[type="submit"]:hover,
        button:hover {
            background-color: #0056b3;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            color: red;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            color: red;
        }

        ul li {
            margin: 5px 0;
        }

        .suggestions {
            border: 1px solid #ccc;
            border-top: none;
            max-height: 150px;
            overflow-y: auto;
            position: absolute;
            background: #fff;
            width: 100%;
            z-index: 1000;
            top: 100%;
            left: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .suggestion-item {
            padding: 10px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .suggestion-item:hover {
            background: #f0f0f0;
        }

        .forgot-password {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            color: #555;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #007bff;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h2 {
                font-size: 24px;
            }

            .form-group input[type="text"],
            .form-group input[type="password"] {
                padding: 10px;
                font-size: 14px;
            }

            .form-group input[type="submit"],
            button {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="off" required />
        <div id="suggestions" class="suggestions"></div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit">Login</button>
      <a href="#" class="forgot-password">Forgot your password?</a>
      <ul id="error-list"></ul>
    </form>
  </div>

  <script>
    // Autocomplete suggestions
    const usernameInput = document.getElementById('username');
    const suggestionsBox = document.getElementById('suggestions');

    usernameInput.addEventListener('input', function () {
      const query = this.value;
      if (query.length < 2) {
        suggestionsBox.innerHTML = '';
        return;
      }

      fetch(`/api/usernames?query=${encodeURIComponent(query)}`)
        .then(res => res.json())
        .then(usernames => {
          suggestionsBox.innerHTML = '';
          usernames.forEach(username => {
            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.textContent = username;
            div.onclick = () => {
              usernameInput.value = username;
              suggestionsBox.innerHTML = '';
            };
            suggestionsBox.appendChild(div);
          });
        })
        .catch(console.error);
    });

    // Hide suggestions when clicking outside
    document.addEventListener('click', function (e) {
      if (!usernameInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
        suggestionsBox.innerHTML = '';
      }
    });

    // Login form submission
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const formData = new FormData(this);
      const errorList = document.getElementById('error-list');
      errorList.innerHTML = ''; // Clear previous errors

      fetch('/login', {
        method: 'POST',
        body: formData
      })
        .then(async response => {
          const contentType = response.headers.get('content-type');
          const isJSON = contentType && contentType.includes('application/json');
          const data = isJSON ? await response.json() : { message: await response.text() };

          if (response.ok && data.token) {
            localStorage.setItem('token', data.token);

            // Store the user role (admin or not) in localStorage or sessionStorage
            localStorage.setItem('role', data.role);  // Assuming your backend sends role along with the token.

            // Redirect based on role (admin or user)
            if (data.role === 'admin') {
              window.location.href = '/admin-dashboard'; // Redirect to admin dashboard
            } else {
              window.location.href = '/dashboard'; // Redirect to normal user dashboard
            }
          } else {
            const li = document.createElement('li');
            li.textContent = data.message || 'Login failed';
            errorList.appendChild(li);
          }
        })
        .catch(err => {
          const li = document.createElement('li');
          li.textContent = 'Something went wrong: ' + err.message;
          errorList.appendChild(li);
        });
    });
  </script>
</body>
</html>
