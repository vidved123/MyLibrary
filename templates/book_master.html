<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Master</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/BookMaster.css') }}">
</head>
<body>
    <div class="book-master-container">
        <h1>Book Master</h1>
        <h2>Book Roster</h2>

        <!-- Table Wrapper -->
        <div class="table-container">
            <table class="book-master-table">
                <thead>
                    <tr class="book-master-tr">
                        <th class="book-master-th">Title</th>
                        <th class="book-master-th">Author</th>
                        <th class="book-master-th">Total Copies</th>
                        <th class="book-master-th">Available Copies</th>
                    </tr>
                </thead>
                <tbody>
                    {% for book in books %}
                    <tr class="book-master-tr">
                        <td class="book-master-td">{{ book.title }}</td>
                        <td class="book-master-td">{{ book.author }}</td>
                        <td class="book-master-td">{{ book.total_copies }}</td>
                        <td class="book-master-td">{{ book.available_copies }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- Back to Library Button -->
        <a href="{{ url_for('library') }}" class="back-link">Back to Library</a>
    </div>
</body>
</html>
