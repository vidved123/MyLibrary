<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Profile.css') }}">
</head>
<body>
    <div class="profile-container">
        <h1>Your Profile</h1>

        <form action="{{ url_for('update_profile') }}" method="POST">
            <input type="hidden" name="user_id" value="{{ user['id'] }}">

            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" value="{{ user['username'] }}" readonly>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="{{ user['email'] }}" required>
            </div>

            <div class="form-group">
                <label for="full_name">Full Name:</label>
                <input type="text" id="full_name" name="full_name" value="{{ user['full_name'] }}" required>
            </div>

            <div class="form-group">
                <label for="sex">Gender:</label>
                <select id="sex" name="sex" required>
                    <option value="MALE" {% if user['sex'] == 'MALE' %}selected{% endif %}>Male</option>
                    <option value="FEMALE" {% if user['sex'] == 'FEMALE' %}selected{% endif %}>Female</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mobile_number">Mobile Number:</label>
                <input type="text" id="mobile_number" name="mobile_number" value="{{ user['mobile_number'] }}" required>
            </div>

            <div class="form-group">
                <label for="country_code">Country Code:</label>
                <input type="text" id="country_code" name="country_code" value="{{ user['country_code'] }}" required>
            </div>

            <button type="submit">Update Profile</button>
        </form>

        <form action="{{ url_for('delete_profile') }}" method="POST" style="margin-top: 20px;">
            <input type="hidden" name="user_id" value="{{ user['id'] }}">
            <button type="submit" class="confirmation-button" onclick="return confirm('Are you sure you want to delete your profile?');">Delete Profile</button>
        </form>

        <a href="{{ url_for('dashboard') }}" class="back-button">Back to Dashboard</a>
    </div>
</body>
</html>
