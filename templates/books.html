<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Books.css') }}">
</head>
<body>
    <div class="book-list-container">
        <h1>Available Books</h1>
        {% if message %}
            <p>{{ message }}</p>
        {% endif %}
        <ul>
            {% for book in books %}
                <li>
                    <span>{{ book.title }} by {{ book.author }}</span>
                    <a href="{{ url_for('borrow_books', book_id=book.id) }}">Borrow Book</a>
                </li>
            {% endfor %}
        </ul>
        <pre>{{ books | tojson(indent=2) }}</pre>
    </div>
</body>
</html>
