<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/AddBooks.css') }}">
</head>
<body>
    <div class="container">
        <h1>Add a New Book</h1>

        <!-- Manual Book Addition Form -->
        <form method="POST" action="{{ url_for('add_books') }}" enctype="multipart/form-data">
            <input type="text" name="title" placeholder="Title" required>
            <input type="text" name="author" placeholder="Author" required>
            <input type="number" name="total_copies" placeholder="Total Copies" required min="1">
            <input type="file" name="image" accept="image/*">
            <button type="submit">Add Book</button>
        </form>

        <hr>

        <!-- Excel Upload Form -->
        <form method="POST" action="{{ url_for('add_books') }}" enctype="multipart/form-data">
            <label for="excel_file">Upload Excel (.xlsx):</label>
            <input type="file" name="excel_file" accept=".xlsx" required>
            <button type="submit">Upload Excel</button>
        </form>

        <hr>

        <!-- Back to Library Button -->
        <a href="{{ url_for('library') }}" class="back-link">← Back to Library</a>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=True) %}
            {% if messages %}
                <div class="flash-messages">
                    <ul>
                        {% for category, message in messages %}
                            <li class="{{ category }}">{{ message }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
